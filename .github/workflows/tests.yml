name: Foundation M2 and Installer M3
on:
  push:
    branches: [main, feat/r4a-foundation, feat/r4b-installer]
  pull_request:
permissions:
  contents: read
jobs:
  foundation:
    name: M2 + M3 (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node == 22 && 24 || 22 }}
      - name: Record alternate supported runtime for the real handoff gate
        id: alternate
        run: node -e "require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT, 'path=' + process.execPath + '\n')"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Pin checkout byte policy
        run: git config core.autocrlf false
      - name: Run complete foundation gates in isolated roots
        if: runner.os != 'Windows'
        env:
          TEST_OTHER_NODE: ${{ steps.alternate.outputs.path }}
        run: node --experimental-strip-types test/run.ts --fetch
      - name: Run complete foundation gates in isolated roots (native cmd controller)
        if: runner.os == 'Windows'
        shell: cmd
        env:
          TEST_OTHER_NODE: ${{ steps.alternate.outputs.path }}
        run: node --experimental-strip-types test/run.ts --fetch
      - name: Exact-head evidence
        uses: actions/upload-artifact@v4
        with:
          name: foundation-${{ matrix.os }}-node${{ matrix.node }}
          path: dist/
  deterministic:
    name: Byte-identical artifacts across six combinations
    needs: foundation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: foundation-*
          path: .isolation/matrix
      - name: Compare every artifact byte across the matrix
        run: node --experimental-strip-types tools/compare-builds.ts .isolation/matrix
