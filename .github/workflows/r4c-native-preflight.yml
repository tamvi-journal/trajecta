name: R4c Windows native contract
on:
  push:
    branches: [feat/r4c-plugin]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Verify settled native wrapper contract (supersedes historical reader probe)
        run: node --experimental-strip-types --test test/windows-wrapper.test.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-native-contract-node${{ matrix.node }}
          path: dist/
  remaining:
    name: Remaining M5 (Node ${{ matrix.node }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Verify pinned engines without changing their lock
        run: node --experimental-strip-types --input-type=module -e "import {vendor} from './tools/engine-lock.ts'; vendor(undefined, true)"
      - name: Remaining real Windows M5 acceptance (STOPs are failures, not simulated passes)
        shell: cmd
        run: node --experimental-strip-types --test test/windows-m5-remaining.test.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-native-m5-node${{ matrix.node }}
          path: dist/
  console-observation:
    name: Console observation only (Node ${{ matrix.node }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Verify existing engine pins
        run: node --experimental-strip-types --input-type=module -e "import {vendor} from './tools/engine-lock.ts'; vendor(undefined, true)"
      - name: Observe console outcomes without changing M5 acceptance
        shell: cmd
        run: node --experimental-strip-types --test test/windows-console-observation.test.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-console-observation-node${{ matrix.node }}
          path: dist/
  applocker:
    name: M8 diagnostic — AppLocker (not a PR gate)
    needs: [native, remaining, console-observation]
    if: >-
      ${{ !cancelled() && github.repository == 'tamvi-journal/trajecta' &&
          github.event_name == 'workflow_dispatch' }}
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Record the Node 24 executable
        run: '"TEST_M5_NODE24=$((Get-Command node.exe).Source)" >> $env:GITHUB_ENV'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enforce the test policy and record controls before testing wrappers
        run: |
          $env:TEST_M5_NODE22 = (Get-Command node.exe).Source
          ./test/windows-m5-applocker.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-m5-applocker
          path: dist/
